schema: spec-driven

rules:
  tasks:
    - >-
      Проверка задачи — то, что агент выполняет и проверяет сам: сборка,
      юнит-тесты решений тренажёра и проверка связки с REAPER вживую чёрным
      ящиком инструментами tools/live — публичный API REAPER из скриптов Lua,
      виртуальная MIDI-клавиатура, щелчки и снимки окна тренажёра на Xvfb,
      журнал тренажёра. Поведение самого REAPER проверки задач не проверяют:
      его выясняет разведка и записывает фактами в findings.md изменения.
      Проверок, которым нужно участие пользователя (звук в комнате, игра на
      инструменте), в задачах нет.
    - >-
      Разведка и проверка гипотез могут пользоваться отладочным кодом в
      отдельных сборках модуля: например, аудиохук пишет в журнал позицию и
      состояние транспорта на каждом блоке. После разведки отладочный код
      удаляется: в коде изменения и в его сборке его нет.

context: |
  Комментарии в коде не ссылаются на документы изменений — решения design.md,
  факты findings.md, макеты: сведение, ради которого стояла бы ссылка,
  записывается в самом комментарии. Имена основных спецификаций (например
  `timing-display`) в комментариях допустимы. Если файл меняется, такие ссылки
  удаляются во всём файле.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

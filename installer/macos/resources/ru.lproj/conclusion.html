<p><b>reaper-training</b> установлен.</p>
<p>Запустите REAPER: в его консоли (ReaScript console output) появится строка
<code>reaper-training … loaded</code>.</p>
<p>Чтобы удалить расширение, закройте REAPER и удалите
<code>reaper_training.dylib</code> из
<code>~/Library/Application&nbsp;Support/REAPER/UserPlugins</code>.</p>
</body></html>

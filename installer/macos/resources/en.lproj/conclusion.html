<p><b>reaper-training</b> is installed.</p>
<p>Start REAPER: its console (ReaScript console output) shows the line
<code>reaper-training … loaded</code>.</p>
<p>To remove the extension, close REAPER and delete
<code>reaper_training.dylib</code> from
<code>~/Library/Application&nbsp;Support/REAPER/UserPlugins</code>.</p>
</body></html>
